<!DOCTYPE html>
<html lang="vi">
<head><meta charset="UTF-8"><title>Đăng ký - Demo</title><link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body>
<div class="container mt-5 mb-5">
    <div class="row justify-content-center"><div class="col-md-6">
        <div class="card shadow-sm"><div class="card-body p-5">
            <h3 class="text-center">Tạo tài khoản</h3>
            <form onsubmit="alert('Demo: Đăng ký thành công! Hãy đăng nhập.'); window.location.href='login.html'; return false;">
                <div class="form-group"><input type="text" class="form-control" placeholder="Tên đăng nhập" required></div>
                <div class="form-group"><input type="text" class="form-control" placeholder="Họ và tên" required></div>
                <div class="form-group"><input type="password" class="form-control" placeholder="Mật khẩu" required></div>
                <div class="form-group"><input type="password" class="form-control" placeholder="Xác nhận mật khẩu" required></div>
                <button type="submit" class="btn btn-danger-custom btn-block">Đăng ký</button>
            </form>
        </div></div>
    </div></div>
</div>
</body>
</html>
